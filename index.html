<h1 class="brand">DOST UGE</h1><div id="ah"></div>
<form id="f" novalidate></form><div id="amsg"></div>
<div class="ctl"><div class="themes seg" aria-label="Theme"></div><div class="decos seg" aria-label="Background decoration"></div></div>
</div></div>

<div id="app">
<header><button class="ico" id="mL" aria-label="Pages menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="t"><svg class="mark"><use href="#atom"/></svg>DOST UGE</div>
<button class="ico" id="mR" aria-label="Profile" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg></button></header>
<aside class="side" id="left"><div class="sh"><span><span class="ttl">DOST UGE</span><span class="dsub" id="dem"></span></span><button class="ico" data-close aria-label="Close">&#10005;</button></div><nav class="nav" id="nav"></nav></aside>
<aside class="side" id="right"></aside><div id="scrim"></div>
<main id="main"></main></div><div id="toast"></div>
<div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="mc"><h3 id="mt"></h3><p class="dim" id="mx"></p><div class="acts"><button class="btn ghost sm" id="mn">Cancel</button><button class="btn sm" id="my">OK</button></div></div></div>

<script>
const SESS=['Day 1 (AM)','Day 1 (PM)','Day 2 (AM)','Day 2 (PM)'],ROLES=['Supervising Examiner','Room Examiner','Admission Officer','Marshal','Janitor','Volunteer'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK='',ME=null,PAGE='',USERS=[],mode='login';
try{TOK=sessionStorage.getItem('t')||''}catch(e){}
const API='https://script.google.com/macros/s/AKfycbz46rp-pPUqgWpMYfT9AQre7ATnKzuVGgXPPVs7hrvvhIzRLqu9lIswUuzffyVxh-J4Dw/exec';
const call=async(fn,a={})=>{let r;try{const x=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,t:TOK,a})});r=await x.json()}catch(e){throw 'Cannot reach the server. Check the API URL and your connection.'}if(!r.ok)throw r.e;return r.d};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
const err=e=>toast(e&&e.message||e);
const isRole=(...r)=>ME&&ME.roleStatus==='approved'&&r.includes(ME.role);
const busy=(b,on)=>{if(b){b.classList.toggle('load',on);b.disabled=on}};
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ic=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const IC={cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',ao:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/>',usr:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',one:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',shd:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',pal:'<circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 0 0 0 14 2 2 0 0 1 0 4"/>'};
const CHEV='<svg class="sdrop-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
let drops=[];
function dd(root){(root||document).querySelectorAll('select:not(.sdrop-native)').forEach(enh)}
function enh(sel){
  const w=mk('div','sdrop');sel.parentNode.insertBefore(w,sel);sel.classList.add('sdrop-native');w.appendChild(sel);
  const b=mk('button','sdrop-btn'),lab=mk('span','sdrop-label');b.type='button';b.appendChild(lab);b.insertAdjacentHTML('beforeend',CHEV);
  const list=mk('div','sdrop-list hidden');w.append(b,list);
  const sync=()=>{const o=sel.options[sel.selectedIndex];lab.textContent=o?o.textContent:''};
  const close=()=>{list.classList.add('hidden');w.classList.remove('open')};
  b.onclick=()=>{if(!list.classList.contains('hidden'))return close();drops.forEach(d=>d.close());list.textContent='';
    Array.from(sel.options).forEach(o=>{const it=mk('button','sdrop-item'+(o.value===sel.value?' sel':''),o.textContent);it.type='button';it.onclick=()=>{sel.value=o.value;sync();close();sel.dispatchEvent(new Event('change',{bubbles:true}))};list.appendChild(it)});
    list.classList.remove('hidden');w.classList.add('open')};
  sel._sync=sync;drops.push({w,close});sync();
}
document.addEventListener('click',e=>{drops=drops.filter(d=>d.w.isConnected);drops.forEach(d=>{if(!d.w.contains(e.target))d.close()})});
const P=(t,b,c)=>`<div class="panel ${c||''}"><div class="ph">${t}</div><div class="pb">${b}</div></div>`;
const sk=n=>Array.from({length:n},()=>'<div class="sk"></div>').join('');
const store=()=>{try{sessionStorage.setItem('c',JSON.stringify({ME,USERS}))}catch(e){}};
function ask(title,text,yes){return new Promise(res=>{$('#mt').textContent=title;$('#mx').textContent=text;$('#my').textContent=yes||'OK';const m=$('#modal'),d=v=>{m.classList.add('hidden');res(v)};m.classList.remove('hidden');$('#my').onclick=()=>d(1);$('#mn').onclick=()=>d(0);$('#my').focus()})}

/* ---------- auth ---------- */
const THEMES={light:'Light',classic:'Classic',night:'Night'},DECOS={none:'None',dots:'Dots',waves:'Waves',both:'Both'};
function setTheme(t){const h=document.documentElement;h.classList.add('tx');h.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}themeUI();setTimeout(()=>h.classList.remove('tx'),400)}
function setDeco(d){document.documentElement.dataset.deco=d;try{localStorage.setItem('dc',d)}catch(e){}themeUI()}
function themeUI(){const D=document.documentElement.dataset;
  const seg=(el,O,cur,at)=>el.innerHTML=Object.keys(O).map(k=>`<button type="button" ${at}="${k}" class="${k===cur?'on':''}" aria-pressed="${k===cur}">${O[k]}</button>`).join('');
  document.querySelectorAll('.themes').forEach(el=>seg(el,THEMES,D.theme,'data-t'));document.querySelectorAll('.decos').forEach(el=>seg(el,DECOS,D.deco,'data-dc'))}
const FORMS={login:['Welcome back','Log in to continue'],signup:['Create your account','Your email is confirmed by the administrator'],forgot:['Reset password','We will email you a reset code'],reset:['Choose a new password','Enter the code from your email']};
const fld=(id,l,type,x)=>`<div class="fld"><input id="${id}" type="${type||'text'}" placeholder=" " ${x||''}><label for="${id}">${l}</label></div>`;
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
function authUI(){
  $('#ah').innerHTML=`<h2>${FORMS[mode][0]}</h2><p class="sub">${FORMS[mode][1]}</p>`;
  const em=fld('em','Email address','email','autocomplete="username"'),cd=fld('cd','6-digit code','text','inputmode="numeric" maxlength="6" autocomplete="one-time-code"'),nm=fld('nm','Full name','text','autocomplete="name"');
  const pw=(l,ac)=>`<div class="fld pwf"><input id="pw" type="password" placeholder=" " autocomplete="${ac}"><label for="pw">${l}</label><button type="button" class="eye" id="eye" aria-label="Show or hide password">${EYE}</button></div>`;
  const go=t=>`<button type="submit" class="btn block" id="go">${t}</button>`,L=(m,t)=>`<button type="button" class="link" data-m="${m}">${t}</button>`,alt=(m,t)=>`<p class="alt">${L(m,t)}</p>`;
  $('#f').innerHTML={login:em+pw('Password','current-password')+`<div class="rt">${L('forgot','Forgot password?')}</div>`+go('Log in')+alt('signup','Need an account? Sign up'),
   signup:nm+em+pw('Password (8+ characters)','new-password')+go('Create account')+alt('login','Already registered? Log in'),
   forgot:em+go('Send reset code')+alt('reset','I already have a code')+alt('login','Back to log in'),
   reset:em+cd+pw('New password','new-password')+go('Change password')+alt('login','Back to log in')}[mode];
  const eye=$('#eye');if(eye)eye.onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'};
  themeUI();
}
$('#f').onclick=e=>{const m=e.target.dataset.m;if(m){mode=m;$('#amsg').innerHTML='';authUI()}};
$('#f').onsubmit=e=>{e.preventDefault();submitAuth()};
$('#f').oninput=e=>{const f=e.target.closest('.fld');if(f){f.classList.remove('bad');const n=f.nextElementSibling;if(n&&n.classList.contains('ferr'))n.remove()}};
function bad(id,t){const f=$('#'+id).closest('.fld');f.classList.add('bad');f.insertAdjacentHTML('afterend',`<div class="ferr">${t}</div>`)}
function shake(){const c=$('#card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
async function submitAuth(){
  const g=i=>($('#'+i)||{}).value||'';const a={email:g('em').trim(),password:g('pw'),name:g('nm'),code:g('cd')};
  const msg=(t,ok)=>$('#amsg').innerHTML=`<div class="msg ${ok?'ok':''}">${esc(t)}</div>`;
  document.querySelectorAll('.ferr').forEach(n=>n.remove());document.querySelectorAll('.fld.bad').forEach(n=>n.classList.remove('bad'));$('#amsg').innerHTML='';
  let ok=1;
  if(!/^\S+@\S+\.\S+$/.test(a.email)){bad('em','Enter a valid email address.');ok=0}
  if(mode!=='forgot'&&!a.password){bad('pw','Enter your password.');ok=0}
  if(mode==='signup'&&!a.name.trim()){bad('nm','Enter your full name.');ok=0}
  if(mode==='reset'&&!a.code.trim()){bad('cd','Enter the code.');ok=0}
  if(!ok)return shake();
  const b=$('#go');busy(b,1);
  try{
    if(mode==='login'){const r=await call('login',a);TOK=r.token;ME=r.me;USERS=r.users||[];try{sessionStorage.setItem('t',TOK)}catch(e){}store();enter()}
    else{const t=await call(mode,a);if(mode==='forgot')msg(t,1);else{mode='login';authUI();msg(t,1)}}
  }catch(e){msg(e.message||e);shake()}
  const b2=$('#go');if(b2)busy(b2,0);
}
/* ---------- shell ---------- */
function enter(){$('#auth').style.display='none';$('#app').style.display='block';nav();profile();go(PAGE||SESS[0])}
async function boot(){
  let cached=null;try{cached=JSON.parse(sessionStorage.getItem('c')||'null')}catch(e){}
  if(cached&&cached.ME){ME=cached.ME;USERS=cached.USERS||[];enter()}          // instant paint from the last visit
  try{const r=await call('boot');const chg=JSON.stringify(r.users)!==JSON.stringify(USERS);ME=r.me;USERS=r.users;store();nav();profile();if(!cached)enter();else if(chg&&SESS.includes(PAGE)&&!$('#ex').value)go(PAGE)}
  catch(e){if(!cached||/expired|log in/i.test(String(e))){TOK='';try{sessionStorage.clear()}catch(x){}location.reload()}else err(e)}
}
function nav(){
  const a=(p,i,l)=>`<a data-p="${p}">${ic(IC[i])}${l}</a>`;
  let h='<h4>Sessions</h4>'+SESS.map(x=>a(x,'cal',x)).join('');
  const ao=isRole('Admission Officer','Supervising Examiner'),se=isRole('Supervising Examiner');
  if(ao||se)h+='<h4 class="adm">Admin tools</h4>';
  if(ao)h+=a('AO','ao','Admission desk');
  if(se)h+=a('USERS','usr','Users and roles');
  $('#dem').textContent=ME.email;
  $('#nav').innerHTML=h;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===PAGE));
}
function profile(){
  const st=ME.roleStatus,ini=esc((ME.name||'?')[0].toUpperCase());
  $('#mR').innerHTML=ini;$('#mR').classList.add('av');
  $('#right').innerHTML=`<div class="phead"><span class="ttl">Profile</span><button class="ico" data-close aria-label="Close">&#10005;</button></div>
  <div class="pbody"><div class="p-banner"></div><div class="pbox"><div class="who">${ini}</div><div class="pname">${esc(ME.name)}</div>
  <div class="pills">${ME.role?`<span class="pill ${st==='approved'?'':'y'}">${esc(ME.role)} (${esc(st)})</span>`:'<span class="pill y">No role yet</span>'}${ME.owner?'<span class="pill">Owner</span>':''}</div></div>
  <div class="pcards">
  <section class="pcard"><div class="pch">${ic(IC.one)}Account</div><div class="pcb"><div class="kv"><span>Name</span><b>${esc(ME.name)}</b></div><div class="kv"><span>Email</span><b>${esc(ME.email)}</b></div></div></section>
  <section class="pcard"><div class="pch">${ic(IC.shd)}Role</div><div class="pcb"><select id="rs">${ROLES.map(r=>`<option ${r===ME.role?'selected':''}>${r}</option>`).join('')}</select>
  <p style="margin-top:10px"><button class="btn sm" id="sr">Request role</button></p><p class="dim" style="font-size:13px;margin-top:6px">${ME.owner?'Owner roles apply immediately.':'Role requests are sent to dost.scholarships@ateneo.edu for approval.'}</p></div></section>
  <section class="pcard"><div class="pch">${ic(IC.pal)}Appearance</div><div class="pcb"><div class="themes seg"></div><div class="decos seg" style="margin-top:8px"></div></div></section>
  </div></div><div class="pfoot"><button class="btn ghost sm" id="lo">Log out</button></div>`;
  dd($('#right'));themeUI();
  $('#sr').onclick=async()=>{const b=$('#sr');busy(b,1);try{ME=await call('setRole',{role:$('#rs').value});store();toast(ME.roleStatus==='approved'?'Role set':'Role sent for approval');nav();profile();go(PAGE)}catch(e){err(e);busy(b,0)}};
  $('#lo').onclick=async()=>{busy($('#lo'),1);try{await call('logout')}catch(e){}TOK='';try{sessionStorage.clear()}catch(e){}location.reload()};
}
const closeAll=()=>{['#left','#right'].forEach(i=>$(i).classList.remove('open'));$('#scrim').classList.remove('on');['#mL','#mR'].forEach(i=>$(i).setAttribute('aria-expanded','false'))};
function toggle(id,btn){const o=$(id).classList.contains('open');closeAll();if(!o){$(id).classList.add('open');$('#scrim').classList.add('on');$(btn).setAttribute('aria-expanded','true')}}
$('#mL').onclick=()=>toggle('#left','#mL');$('#mR').onclick=()=>toggle('#right','#mR');$('#scrim').onclick=closeAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();if(!$('#modal').classList.contains('hidden'))$('#mn').click()}});
document.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeAll();const t=e.target.dataset&&e.target.dataset.t;if(t)setTheme(t);const dc=e.target.dataset&&e.target.dataset.dc;if(dc)setDeco(dc)});
$('#nav').onclick=e=>{const p=e.target.dataset.p;if(p){go(p);closeAll()}};
function go(p){
  PAGE=p;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
  if(SESS.includes(p))sessionPage(p);else if(p==='AO'&&isRole('Admission Officer','Supervising Examiner'))aoPage();
  else if(p==='USERS'&&isRole('Supervising Examiner'))usersPage();else sessionPage(SESS[0]);
}
/* ---------- session pages ---------- */
function sessionPage(s){
  PAGE=s;$('#main').innerHTML=`<h2>${s}</h2>`+P('Examiner',`<div class="box"><label for="ex">Examiner</label><select id="ex"><option value="">Choose an examiner</option>${USERS.map(u=>`<option value="${esc(u.email)}">${esc(u.name)}${u.role?' ('+esc(u.role)+')':''}</option>`).join('')}</select></div>`)+'<div id="vt"></div>';
  dd($('#main'));
  $('#ex').onchange=async e=>{
    if(!e.target.value){$('#vt').innerHTML='';return}
    $('#vt').innerHTML=sk(2);
    try{const d=await call('view',{session:s,email:e.target.value});if($('#ex').value!==e.target.value)return;
      if(!d.rooms.length){$('#vt').innerHTML='<div class="empty">This examiner has no testing room in this session.</div>';return}
      $('#vt').innerHTML=d.rooms.map(r=>{const rs=d.rows.filter(x=>x.room===r);return `<div class="panel room"><div class="rh"><span>Room ${pad(r)}</span><span class="cnt">${rs.length}</span></div><div class="wrap"><table><tr><th><span class="full">Seat No.</span><span class="short">SN</span></th><th><span class="full">Examinee No.</span><span class="short">EN</span></th><th><span class="full">Full name</span><span class="short">Name</span></th><th>Sex</th></tr>${rs.length?rs.map(x=>`<tr><td>${x.seat}</td><td>${esc(x.tc)}</td><td>${esc(x.name)}</td><td><span class="sx ${x.sex==='M'?'m':'f'}" title="${x.sex==='M'?'Male':'Female'}">${esc(x.sex)}</span></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No admitted examinees yet.</td></tr>'}</table></div></div>`}).join('')}catch(x){$('#vt').innerHTML='';err(x)}};
}
/* ---------- admission desk ---------- */
let S,D={rows:[],rooms:0,assign:[]},open=new Set(),conflict=null;
const pad=n=>String(n).padStart(2,'0'),key=r=>pad(r.room)+'-'+pad(r.seat);
function aoPage(){
  S=S||SESS[0];
  $('#main').innerHTML='<h2>Admission desk</h2>'+
  P('Upload roster',`<div class="row"><div><label for="as">Session</label><select id="as">${SESS.map(s=>`<option ${s===S?'selected':''}>${s}</option>`).join('')}</select></div>
  <div><label for="fl">Excel or CSV file</label><input id="fl" type="file" accept=".csv,.xlsx,.xls"></div><button class="btn" id="up">Upload as this session</button></div>
  <p class="dim" style="margin:10px 0 0;font-size:13px">Columns: TC Examinee No., Full Name, Sex, Phone No. Uploading replaces this session's table.</p>`)+
  P('Testing rooms',`<div class="row"><div><label for="nr">Testing rooms (TR) for this session</label><input id="nr" type="number" min="0" max="99"></div><button class="btn" id="sv">Save rooms and examiners</button></div><div class="grid" id="rg" style="margin-top:12px"></div>`)+
  P('Examinees',`<div class="tiles" id="st"></div><div class="row"><div><label for="q">Search name</label><input id="q" type="text" placeholder="Any part of the name"></div><div><label for="fr">Room</label><select id="fr"></select></div><div><label for="fs">Seat</label><select id="fs"></select></div></div><div id="cb"></div><div class="wrap" id="tb" style="margin-top:12px"></div>`);
  dd($('#main'));
  $('#as').onchange=e=>{S=e.target.value;conflict=null;load()};$('#up').onclick=upload;$('#sv').onclick=saveRooms;
  $('#q').oninput=table;['fr','fs'].forEach(i=>$('#'+i).onchange=table);$('#nr').onchange=()=>{D.rooms=+$('#nr').value||0;rooms();filters()};load();
}
async function load(){const s=S;$('#tb').innerHTML=sk(3);try{const d=await call('getRoster',{session:s});if(s!==S||PAGE!=='AO')return;D=d;open.clear();$('#nr').value=D.rooms;rooms();filters();table()}catch(e){err(e)}}
function rooms(){const n=+$('#nr').value||0;
  $('#rg').innerHTML=Array.from({length:n},(_,i)=>{const a=(D.assign.find(x=>x.room===i+1)||{}).email||'';return `<div><label>TR ${pad(i+1)} examiner</label><select data-r="${i+1}"><option value="">Unassigned</option>${USERS.map(u=>`<option value="${esc(u.email)}" ${u.email===a?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`}).join('');dd($('#rg'))}
function filters(){const n=+D.rooms||0,v=$('#fr').value;$('#fr').innerHTML='<option value="">All rooms</option>'+Array.from({length:n},(_,i)=>`<option value="${i+1}">Room ${pad(i+1)}</option>`).join('');$('#fr').value=v;
  if(!$('#fs').options.length)$('#fs').innerHTML='<option value="">All seats</option>'+Array.from({length:30},(_,i)=>`<option value="${i+1}">Seat ${pad(i+1)}</option>`).join('');
  ['fr','fs'].forEach(i=>$('#'+i)._sync&&$('#'+i)._sync())}
async function saveRooms(){const b=$('#sv'),n=+$('#nr').value||0,assign=[...document.querySelectorAll('#rg select')].map(s=>({room:s.dataset.r,email:s.value})).filter(x=>x.email);
  busy(b,1);try{await call('setRooms',{session:S,n,assign});D.rooms=n;D.assign=assign.map(x=>({room:+x.room,email:x.email}));filters();toast('Rooms saved')}catch(e){err(e)}busy(b,0)}
function csv(t){const out=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=0;else c+=ch}else if(ch=='"')q=1;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);out.push(r);r=[];c=''}else c+=ch}if(c||r.length){r.push(c);out.push(r)}return out}
async function upload(){
  const f=$('#fl').files[0];if(!f)return toast('Choose a file first');const b=$('#up');
  try{let m;const buf=await f.arrayBuffer();
    if(/\.csv$/i.test(f.name))m=csv(new TextDecoder().decode(buf));else{if(!window.XLSX)throw 'The Excel reader is still loading. Try again.';const wb=XLSX.read(buf,{type:'array'});m=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
    const nk=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),h=m[0].map(nk),ix=k=>h.indexOf(k);
    const I={tc:ix('tcexamineeno'),name:ix('fullname'),sex:ix('sex'),phone:ix('phoneno')};
    if(Object.values(I).some(v=>v<0))throw 'Missing column. Needed: TC Examinee No., Full Name, Sex, Phone No.';
    const rows=m.slice(1).map(r=>({tc:String(r[I.tc]).trim(),name:String(r[I.name]).trim(),sex:String(r[I.sex]).trim().charAt(0).toUpperCase(),phone:String(r[I.phone]).trim()})).filter(r=>r.name);
    if(!(await ask('Replace table?',`Replace the ${S} table with ${rows.length} examinees?`,'Replace')))return;
    busy(b,1);await call('saveRoster',{session:S,rows});toast(rows.length+' examinees saved to '+S);$('#fl').value='';busy(b,0);load()
  }catch(e){busy(b,0);err(e.message||e)}}
function table(){
  const q=$('#q').value.trim().toLowerCase(),fr=$('#fr').value,fs=$('#fs').value;
  const cnt={};D.rows.filter(r=>r.admitted).forEach(r=>cnt[key(r)]=(cnt[key(r)]||0)+1);
  const dup=Object.keys(cnt).filter(k=>cnt[k]>1);conflict=dup.length?dup:null;
  let rs=D.rows;
  if(conflict)rs=rs.filter(r=>r.admitted&&conflict.includes(key(r)));
  else rs=rs.filter(r=>(!q||r.name.toLowerCase().includes(q))&&(!fr||r.room==fr)&&(!fs||r.seat==fs));
  $('#cb').innerHTML=conflict?`<div class="msg">Two examinees share the same room and seat (${conflict.join(', ')}). Change either row to continue.</div>`:'';
  const adm=D.rows.filter(r=>r.admitted).length;
  $('#st').innerHTML=`<div class="tile"><i>Examinees</i><b>${D.rows.length}</b></div><div class="tile"><i>Admitted</i><b>${adm}</b></div><div class="tile"><i>Remaining</i><b>${D.rows.length-adm}</b></div>`;
  $('#tb').innerHTML=D.rows.length?`<table><tr><th></th><th>Full name</th><th>TC Examinee No.</th><th>Action</th><th>Room-Seat</th></tr>${rs.map(r=>{
   const o=open.has(r.row);return `<tr class="${conflict?'dup':''}"><td><button class="btn ghost sm" data-d="${r.row}">${o?'Hide':'Details'}</button></td><td>${esc(r.name)}</td><td>${esc(r.tc)}</td>
   <td>${r.admitted?`<button class="btn warn sm" data-w="${r.row}">Withdraw</button>`:`<button class="btn sm" data-a="${r.row}">Admit</button>`}</td>
   <td>${r.admitted?`<input class="slot" data-e="${r.row}" value="${key(r)}" aria-label="Room-Seat">`:''}</td></tr>${o?`<tr class="det"><td></td><td colspan="4">Sex: <b>${esc(r.sex)}</b> &nbsp; Phone: <b>${esc(r.phone)}</b></td></tr>`:''}`}).join('')||'<tr><td colspan="5" class="empty">No matching examinees.</td></tr>'}</table>`:'<div class="empty">Upload a file to build this session\'s table.</div>';
}
document.addEventListener('click',async e=>{const d=e.target.dataset;if(!d||!$('#tb')||PAGE!=='AO')return;
  try{if(d.d){const k=+d.d;open.has(k)?open.delete(k):open.add(k);table()}
  else if(d.a){const b=e.target;busy(b,1);try{const r=await call('admit',{session:S,row:d.a});const x=D.rows.find(y=>y.row==d.a);Object.assign(x,{admitted:true,room:r.room,seat:r.seat});table();toast('Admitted to '+pad(r.room)+'-'+pad(r.seat))}catch(z){busy(b,0);throw z}}
  else if(d.w){const x=D.rows.find(y=>y.row==d.w),old=Object.assign({},x);Object.assign(x,{admitted:false,room:0,seat:0});table();   // instant, rolls back on failure
    try{await call('withdraw',{row:d.w})}catch(z){Object.assign(x,old);table();throw z}}}catch(x){err(x)}});
document.addEventListener('change',async e=>{const row=e.target.dataset&&e.target.dataset.e;if(!row)return;
  const m=e.target.value.match(/^\s*(\d{1,2})\s*-\s*(\d{1,2})\s*$/);if(!m){toast('Use the format 01-13');return table()}
  try{await call('editSlot',{session:S,row,room:+m[1],seat:+m[2]});const r=D.rows.find(x=>x.row==row);r.admitted=true;r.room=+m[1];r.seat=+m[2];table();toast('Updated')}catch(x){err(x);table()}});
/* ---------- users and roles ---------- */
async function usersPage(){
  $('#main').innerHTML='<h2>Users and roles</h2><div class="ulist" id="ul">'+sk(3)+'</div>';
  try{const L=await call('listUsers');if(PAGE!=='USERS')return;
   $('#ul').innerHTML=L.map(u=>`<div class="urow"><div class="uava">${esc((u.name||'?')[0].toUpperCase())}</div><div class="umain"><div class="uname">${esc(u.name)}</div><div class="usub">${esc(u.email)}</div>
   <div class="utags">${u.role?`<span class="pill ${u.roleStatus==='approved'?'':'y'}">${esc(u.role)} · ${esc(u.roleStatus)}</span>`:'<span class="pill y">No role</span>'}<span class="pill ${u.status==='suspended'?'y':''}">${u.status==='suspended'?'Suspended':'Active'}</span>${u.owner?'<span class="pill">Owner</span>':''}</div>
   <div class="usub">${u.assigned.length?u.assigned.map(a=>`${esc(a.session)}: ${a.rooms.map(pad).join(', ')}`).join(' · '):'Not assigned to a room'}</div></div>
   <div class="uact">${u.owner?'':`${u.roleStatus==='pending'?`<button class="btn sm" data-u="approve" data-e="${esc(u.email)}">Approve</button>`:''}${u.status==='suspended'?`<button class="btn sm" data-u="reactivate" data-e="${esc(u.email)}">Reactivate</button>`:`<button class="btn warn sm" data-u="suspend" data-e="${esc(u.email)}">Suspend</button>`}<button class="btn ghost sm" data-u="remove" data-e="${esc(u.email)}">Remove</button>`}</div></div>`).join('')||'<div class="empty">No users yet.</div>';
   $('#ul').onclick=async e=>{const d=e.target.dataset;if(!d.u)return;if(d.u==='remove'&&!(await ask('Remove user?','Permanently delete '+d.e+'? This cannot be undone.','Remove')))return;
     const b=e.target;busy(b,1);try{await call('userAction',{email:d.e,act:d.u});call('users').then(u=>{USERS=u;store()}).catch(()=>{});usersPage()}catch(x){busy(b,0);err(x)}}}catch(e){err(e);$('#ul').textContent=e}
}
themeUI();authUI();if(TOK)boot();
</script></body></html>
